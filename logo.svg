<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Car silhouette -->
  <path d="M 50 110 L 60 90 L 80 85 L 120 85 L 140 90 L 150 110 Z" fill="#ffffff" opacity="0.9"/>
  <rect x="55" y="110" width="90" height="15" rx="2" fill="#ffffff" opacity="0.9"/>
  
  <!-- Wheels -->
  <circle cx="70" cy="125" r="10" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="130" cy="125" r="10" fill="#1e293b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="70" cy="125" r="4" fill="#64748b"/>
  <circle cx="130" cy="125" r="4" fill="#64748b"/>
  
  <!-- Windows -->
  <path d="M 65 90 L 75 85 L 95 85 L 95 95 Z" fill="#3b82f6" opacity="0.6"/>
  <path d="M 105 85 L 125 85 L 135 90 L 105 95 Z" fill="#3b82f6" opacity="0.6"/>
  
  <!-- Elite text -->
  <text x="100" y="160" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">ELITE</text>
  <text x="100" y="178" font-family="Arial, sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">SHOWROOM</text>
</svg>
